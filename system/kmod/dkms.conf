# DKMS: recompila os módulos a cada kernel novo (o install.sh registra esta pasta como nitro-kmod)
PACKAGE_NAME="nitro-kmod"
PACKAGE_VERSION="@VERSION@"
MAKE[0]="make KDIR=${kernel_source_dir}"
BUILT_MODULE_NAME[0]="nitro_fan"
DEST_MODULE_LOCATION[0]="/extra"
BUILT_MODULE_NAME[1]="nitro_battery"
DEST_MODULE_LOCATION[1]="/extra"
AUTOINSTALL="yes"
