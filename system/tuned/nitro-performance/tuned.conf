# Desempenho no Acer Nitro: igual ao throughput-performance, mas com o perfil térmico que o firmware aceita.
# O throughput-performance pede platform_profile=performance (Turbo), que o ANV15-51 recusa com EIO;
# o máximo da máquina é balanced-performance. O install.sh aponta o "Desempenho" do tuned-ppd para cá.
[main]
summary=throughput-performance com platform_profile=balanced-performance (Acer Nitro)
include=throughput-performance

[acpi]
platform_profile=balanced-performance
